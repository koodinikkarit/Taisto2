name: Build and publish Docker image

on:
  push:
    tags: ["v*"]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: koodinikkarit/taisto2

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            companion-module-taisto/package-lock.json

      - name: Verify dependency safety policy
        shell: bash
        run: |
          npm install --package-lock-only
          git diff --exit-code -- package-lock.json

      - name: Set application version from Git tag
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node -e "const fs=require('fs'); const version=process.argv[1]; for (const file of ['package.json','package-lock.json','companion-module-taisto/package.json','companion-module-taisto/package-lock.json']) { const data=JSON.parse(fs.readFileSync(file)); data.version=version; if (data.packages && data.packages['']) data.packages[''].version=version; fs.writeFileSync(file, JSON.stringify(data, null, 2) + '\\n'); } const manifestFile='companion-module-taisto/companion/manifest.json'; const manifest=JSON.parse(fs.readFileSync(manifestFile)); manifest.version=version; fs.writeFileSync(manifestFile, JSON.stringify(manifest, null, 2) + '\\n');" "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build Companion module
        working-directory: companion-module-taisto
        shell: bash
        run: |
          npm ci
          npm run check
          npm run build

      - name: Package Companion module
        shell: bash
        run: |
          STAGE_DIR="$(mktemp -d)"
          MODULE_DIR="$STAGE_DIR/taisto-companion"
          mkdir -p "$MODULE_DIR" public
          cp companion-module-taisto/pkg/* "$MODULE_DIR/"
          cp -R companion-module-taisto/companion "$MODULE_DIR/"
          cp companion-module-taisto/README.md "$MODULE_DIR/"
          cp companion-module-taisto/package.json "$MODULE_DIR/"
          cd "$STAGE_DIR"
          zip -r "$GITHUB_WORKSPACE/public/taisto-companion.zip" taisto-companion

      - name: Upload Companion module artifact
        uses: actions/upload-artifact@v4
        with:
          name: taisto-companion-${{ github.ref_name }}
          path: public/taisto-companion.zip
          if-no-files-found: error

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            BUILD_ID=${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
