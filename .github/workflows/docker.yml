name: Build and publish Docker image

on:
  push:
    tags: ["v*"]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: koodinikkarit/taisto2

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            companion-module-taisto/package-lock.json

      - name: Set application version from Git tag
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node -e "const fs=require('fs'); const version=process.argv[1]; for (const file of ['package.json','package-lock.json','companion-module-taisto/package.json','companion-module-taisto/package-lock.json']) { const data=JSON.parse(fs.readFileSync(file)); data.version=version; if (data.packages && data.packages['']) data.packages[''].version=version; fs.writeFileSync(file, JSON.stringify(data, null, 2) + '\\n'); } const manifestFile='companion-module-taisto/companion/manifest.json'; const manifest=JSON.parse(fs.readFileSync(manifestFile)); manifest.version=version; fs.writeFileSync(manifestFile, JSON.stringify(manifest, null, 2) + '\\n');" "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify dependency safety policy
        shell: bash
        run: |
          npm install --package-lock-only
          git diff --exit-code -- package-lock.json

      - name: Determine latest stable tag
        id: latest
        shell: bash
        run: |
          LATEST_TAG="$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)"
          if [ -z "$LATEST_TAG" ]; then
            echo "No stable vMAJOR.MINOR.PATCH tag was found" >&2
            exit 1
          fi
          if [ "$GITHUB_REF_NAME" = "$LATEST_TAG" ]; then
            echo "is_latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_latest=false" >> "$GITHUB_OUTPUT"
          fi
          echo "latest_tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"

      - name: Build Companion module
        working-directory: companion-module-taisto
        shell: bash
        run: |
          npm ci
          npm run check
          npm run build

      - name: Package Companion module
        shell: bash
        run: |
          STAGE_DIR="$(mktemp -d)"
          MODULE_DIR="$STAGE_DIR/taisto-companion"
          mkdir -p "$MODULE_DIR" public
          cp companion-module-taisto/pkg/* "$MODULE_DIR/"
          cp -R companion-module-taisto/companion "$MODULE_DIR/"
          cp companion-module-taisto/README.md "$MODULE_DIR/"
          cp companion-module-taisto/package.json "$MODULE_DIR/"
          cd "$STAGE_DIR"
          zip -r "$GITHUB_WORKSPACE/public/taisto-companion.zip" taisto-companion

      - name: Upload Companion module artifact
        uses: actions/upload-artifact@v4
        with:
          name: taisto-companion-${{ github.ref_name }}
          path: public/taisto-companion.zip
          if-no-files-found: error

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Docker tags
        id: docker-tags
        shell: bash
        run: |
          {
            echo "tags<<EOF"
            echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
            echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}"
            if [ "${{ steps.latest.outputs.is_latest }}" = "true" ]; then
              echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and publish Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            BUILD_ID=${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          tags: ${{ steps.docker-tags.outputs.tags }}

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              'public/taisto-companion.zip#Taisto Companion module' \
              --clobber
          else
            if [ "${{ steps.latest.outputs.is_latest }}" = "true" ]; then
              LATEST_FLAG="--latest"
            else
              LATEST_FLAG="--latest=false"
            fi
            gh release create "$GITHUB_REF_NAME" \
              'public/taisto-companion.zip#Taisto Companion module' \
              --verify-tag \
              --generate-notes \
              --title "Taisto ${{ steps.version.outputs.version }}" \
              "$LATEST_FLAG"
          fi
          if [ "${{ steps.latest.outputs.is_latest }}" = "true" ]; then
            gh release edit "$GITHUB_REF_NAME" --latest
          else
            RELEASE_ID="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" --jq '.id')"
            gh api --method PATCH \
              "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
              -f make_latest=false >/dev/null
          fi
