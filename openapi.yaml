openapi: 3.0.3
info:
  title: Taisto REST API
  version: 0.1.7
  description: REST interface for managing Taisto matrices, diagrams, default states, output groups and weekly timers. All POST, PATCH, PUT and DELETE operations require an enabled, non-expired API key unless temporary anonymous write access has been enabled in Settings. API keys may also be configured without an expiration date. GET, HEAD and OPTIONS operations are public.
servers:
  - url: http://localhost:1337/rest
paths:
  /:
    get:
      summary: List API resources
      responses: { '200': { description: Resource list } }
  /matrices:
    get: { summary: List matrices, responses: { '200': { description: Matrix list, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Matrix' } } } } } } }
    post: { security: [ { ApiKeyAuth: [] } ], summary: Create matrix, requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateMatrix' } } } }, responses: { '201': { description: Created }, '400': { $ref: '#/components/responses/Error' } } }
  /matrices/{id}:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    get: { summary: Get matrix, responses: { '200': { description: Matrix }, '404': { $ref: '#/components/responses/Error' } } }
    patch: { security: [ { ApiKeyAuth: [] } ], summary: Update matrix, requestBody: { $ref: '#/components/requestBodies/MatrixUpdate' }, responses: { '200': { description: Updated }, '404': { $ref: '#/components/responses/Error' } } }
    delete: { security: [ { ApiKeyAuth: [] } ], summary: Delete matrix, responses: { '204': { description: Deleted }, '404': { $ref: '#/components/responses/Error' } } }
  /matrices/slug/{slug}:
    get: { summary: Get matrix by slug, parameters: [ { $ref: '#/components/parameters/Slug' } ], responses: { '200': { description: Matrix }, '404': { $ref: '#/components/responses/Error' } } }
  /con-ports/{id}:
    patch: { security: [ { ApiKeyAuth: [] } ], summary: Rename Con port, parameters: [ { $ref: '#/components/parameters/Id' } ], requestBody: { $ref: '#/components/requestBodies/Slug' }, responses: { '200': { description: Updated } } }
  /con-ports/{id}/video-connection:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    get: { summary: Get video connection status, responses: { '200': { description: Connection status }, '404': { $ref: '#/components/responses/Error' } } }
    post: { security: [ { ApiKeyAuth: [] } ], summary: Connect Con port to CPU port, requestBody: { $ref: '#/components/requestBodies/CpuPort' }, responses: { '201': { description: Connected }, '400': { $ref: '#/components/responses/Error' } } }
    delete: { security: [ { ApiKeyAuth: [] } ], summary: Disconnect video connection, responses: { '204': { description: Disconnected } } }
  /con-groups:
    get: { summary: List output groups, responses: { '200': { description: Output group list } } }
    post: { security: [ { ApiKeyAuth: [] } ], summary: Create output group, requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ConGroupInput' } } } }, responses: { '201': { description: Created } } }
  /con-groups/{id}:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    get: { summary: Get output group, responses: { '200': { description: Output group }, '404': { $ref: '#/components/responses/Error' } } }
    patch: { security: [ { ApiKeyAuth: [] } ], summary: Update output group, requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/ConGroupInput' } } } }, responses: { '200': { description: Updated } } }
    delete: { security: [ { ApiKeyAuth: [] } ], summary: Delete output group, responses: { '204': { description: Deleted } } }
  /con-groups/{id}/execute:
    post: { security: [ { ApiKeyAuth: [] } ], summary: Switch all group outputs to an input, parameters: [ { $ref: '#/components/parameters/Id' } ], requestBody: { required: true, content: { application/json: { schema: { type: object, required: [cpuPortId], properties: { cpuPortId: { type: string } } } } } }, responses: { '202': { description: Queued } } }
  /cpu-ports/{id}:
    patch: { security: [ { ApiKeyAuth: [] } ], summary: Rename CPU port, parameters: [ { $ref: '#/components/parameters/Id' } ], requestBody: { $ref: '#/components/requestBodies/Slug' }, responses: { '200': { description: Updated } } }
  /cpu-ports/{id}/kwm-connection:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    post: { security: [ { ApiKeyAuth: [] } ], summary: Connect CPU port to Con port, requestBody: { $ref: '#/components/requestBodies/ConPort' }, responses: { '201': { description: Connected } } }
    delete: { security: [ { ApiKeyAuth: [] } ], summary: Disconnect KWM connection, responses: { '204': { description: Disconnected } } }
  /diagrams:
    get: { summary: List diagrams, responses: { '200': { description: Diagram list } } }
    post: { security: [ { ApiKeyAuth: [] } ], summary: Create diagram, requestBody: { $ref: '#/components/requestBodies/Slug' }, responses: { '201': { description: Created } } }
  /diagrams/{id}:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    get: { summary: Get diagram, responses: { '200': { description: Diagram } } }
    patch: { security: [ { ApiKeyAuth: [] } ], summary: Update diagram, requestBody: { $ref: '#/components/requestBodies/Slug' }, responses: { '200': { description: Updated } } }
    delete: { security: [ { ApiKeyAuth: [] } ], summary: Delete diagram, responses: { '204': { description: Deleted } } }
  /diagram-screens:
    get: { summary: List diagram screens, responses: { '200': { description: Diagram screen list } } }
    post: { security: [ { ApiKeyAuth: [] } ], summary: Create diagram screen, requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DiagramScreenInput' } } } }, responses: { '201': { description: Created } } }
  /diagram-screens/{id}:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    get: { summary: Get diagram screen, responses: { '200': { description: Diagram screen } } }
    patch: { security: [ { ApiKeyAuth: [] } ], summary: Update diagram screen, requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DiagramScreenInput' } } } }, responses: { '200': { description: Updated } } }
    delete: { security: [ { ApiKeyAuth: [] } ], summary: Delete diagram screen, responses: { '204': { description: Deleted } } }
  /diagram-screens/{id}/cpus:
    post: { security: [ { ApiKeyAuth: [] } ], summary: Add CPU port to diagram screen, parameters: [ { $ref: '#/components/parameters/Id' } ], requestBody: { $ref: '#/components/requestBodies/CpuPort' }, responses: { '201': { description: Created } } }
  /diagram-screens/{id}/cpus/{cpuPort}:
    delete: { security: [ { ApiKeyAuth: [] } ], summary: Remove CPU port from diagram screen, parameters: [ { $ref: '#/components/parameters/Id' }, { name: cpuPort, in: path, required: true, schema: { type: string } } ], responses: { '204': { description: Deleted } } }
  /default-states:
    get: { summary: List default states, responses: { '200': { description: Default state list } } }
    post: { security: [ { ApiKeyAuth: [] } ], summary: Create default state, requestBody: { required: true, content: { application/json: { schema: { type: object, required: [slug, matrix], properties: { slug: { type: string }, matrix: { type: string } } } } } }, responses: { '201': { description: Created } } }
  /default-states/{id}:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    get: { summary: Get default state, responses: { '200': { description: Default state } } }
    delete: { security: [ { ApiKeyAuth: [] } ], summary: Delete default state, responses: { '204': { description: Deleted } } }
  /default-states/{id}/execute:
    post: { security: [ { ApiKeyAuth: [] } ], summary: Execute default state, parameters: [ { $ref: '#/components/parameters/Id' } ], responses: { '202': { description: Queued } } }
  /default-states/{id}/video-connections:
    post: { security: [ { ApiKeyAuth: [] } ], summary: Add video connection, parameters: [ { $ref: '#/components/parameters/Id' } ], requestBody: { $ref: '#/components/requestBodies/Connection' }, responses: { '201': { description: Created } } }
  /default-states/{id}/kwm-connections:
    post: { security: [ { ApiKeyAuth: [] } ], summary: Add KWM connection, parameters: [ { $ref: '#/components/parameters/Id' } ], requestBody: { $ref: '#/components/requestBodies/Connection' }, responses: { '201': { description: Created } } }
  /weekly-timers:
    get: { summary: List weekly timers, responses: { '200': { description: Timer list } } }
    post: { security: [ { ApiKeyAuth: [] } ], summary: Create weekly timer, responses: { '201': { description: Created } } }
  /weekly-timers/{id}:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    get: { summary: Get weekly timer, responses: { '200': { description: Weekly timer } } }
    patch: { security: [ { ApiKeyAuth: [] } ], summary: Update weekly timer, requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/WeeklyTimerUpdate' } } } }, responses: { '200': { description: Updated } } }
    delete: { security: [ { ApiKeyAuth: [] } ], summary: Delete weekly timer, responses: { '204': { description: Deleted } } }
  /weekly-timers/{id}/video-connections:
    post: { security: [ { ApiKeyAuth: [] } ], summary: Add video connection, parameters: [ { $ref: '#/components/parameters/Id' } ], requestBody: { $ref: '#/components/requestBodies/Connection' }, responses: { '201': { description: Created } } }
  /weekly-timers/{id}/kwm-connections:
    post: { security: [ { ApiKeyAuth: [] } ], summary: Add KWM connection, parameters: [ { $ref: '#/components/parameters/Id' } ], requestBody: { $ref: '#/components/requestBodies/Connection' }, responses: { '201': { description: Created } } }
  /weekly-timers/{id}/default-states:
    post: { security: [ { ApiKeyAuth: [] } ], summary: Add default state to timer, parameters: [ { $ref: '#/components/parameters/Id' } ], requestBody: { required: true, content: { application/json: { schema: { type: object, required: [defaultState], properties: { defaultState: { type: string } } } } } }, responses: { '201': { description: Created } } }
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
  parameters:
    Id: { name: id, in: path, required: true, schema: { type: string } }
    Slug: { name: slug, in: path, required: true, schema: { type: string } }
  requestBodies:
    Slug: { required: true, content: { application/json: { schema: { type: object, required: [slug], properties: { slug: { type: string } } } } } }
    CpuPort: { required: true, content: { application/json: { schema: { type: object, required: [cpuPort], properties: { cpuPort: { type: string } } } } } }
    ConPort: { required: true, content: { application/json: { schema: { type: object, required: [conPort], properties: { conPort: { type: string } } } } } }
    Connection: { required: true, content: { application/json: { schema: { type: object, required: [conPort, cpuPort], properties: { conPort: { type: string }, cpuPort: { type: string } } } } } }
    MatrixUpdate: { content: { application/json: { schema: { $ref: '#/components/schemas/CreateMatrix' } } } }
  responses:
    Error: { description: Error response, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  schemas:
    Matrix: { type: object, properties: { id: { type: string }, slug: { type: string }, ip: { type: string }, port: { type: integer } } }
    CreateMatrix: { type: object, required: [slug, ip, port, conPortAmount, cpuPortAmount], properties: { slug: { type: string }, ip: { type: string }, port: { type: integer }, conPortAmount: { type: integer }, cpuPortAmount: { type: integer } } }
    ConGroupInput: { type: object, required: [slug, matrixId, conPortIds], properties: { slug: { type: string }, matrixId: { type: string }, conPortIds: { type: array, minItems: 1, items: { type: string } } } }
    DiagramScreenInput: { type: object, properties: { diagram: { type: string }, slug: { type: string }, conPort: { type: string }, matrix: { type: string } } }
    WeeklyTimerUpdate: { type: object, properties: { slug: { type: string }, minutes: { type: integer }, hours: { type: integer }, active: { type: boolean }, monday: { type: boolean }, tuesday: { type: boolean }, wednesday: { type: boolean }, thursday: { type: boolean }, friday: { type: boolean }, saturday: { type: boolean }, sunday: { type: boolean } } }
    Error: { type: object, properties: { error: { type: object, properties: { message: { type: string } } } } }
